[project]
name = "apuracao"
version = "0.1.0"
description = "Evolução da apuração das eleições a partir dos boletins de urna do TSE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest"]
superset = ["duckdb-engine"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apuracao"]

