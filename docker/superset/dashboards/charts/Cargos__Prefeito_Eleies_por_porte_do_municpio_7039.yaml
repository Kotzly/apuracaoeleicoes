slice_name: "Prefeito \xB7 Elei\xE7\xF5es por porte do munic\xEDpio"
description: null
certified_by: null
certification_details: null
viz_type: table
params:
  query_mode: aggregate
  groupby:
  - size_band
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: "Munic\xEDpios"
    hasCustomLabel: true
    optionName: "metric_munic\xEDpios"
  - expressionType: SQL
    sqlExpression: AVG(winner_pct)
    label: "% m\xE9dio do eleito"
    hasCustomLabel: true
    optionName: "metric_m\xE9diodoeleito"
  - expressionType: SQL
    sqlExpression: AVG(margin_pp)
    label: "Margem m\xE9dia (p.p.)"
    hasCustomLabel: true
    optionName: "metric_margemm\xE9diapp"
  - expressionType: SQL
    sqlExpression: COUNT(*) FILTER (WHERE has_second_round)
    label: "Com 2\xBA turno"
    hasCustomLabel: true
    optionName: "metric_com2\xBAturno"
  - expressionType: SQL
    sqlExpression: COUNT(*) FILTER (WHERE flipped)
    label: Viradas
    hasCustomLabel: true
    optionName: metric_viradas
  - expressionType: SQL
    sqlExpression: 100.0 * COUNT(*) FILTER (WHERE same_party_as_previous) / NULLIF(COUNT(*)
      FILTER (WHERE same_party_as_previous IS NOT NULL), 0)
    label: '% que manteve o partido'
    hasCustomLabel: true
    optionName: metric_quemanteveopartido
  - expressionType: SQL
    sqlExpression: MIN(eligible_voters)
    label: Menor eleitorado
    hasCustomLabel: true
    optionName: metric_menoreleitorado
  row_limit: 1000
  server_pagination: false
  include_search: true
  annotation_layers: []
  order_desc: false
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: MIN(eligible_voters)
    label: Menor eleitorado
    hasCustomLabel: true
    optionName: metric_menoreleitorado
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: office_code
    operator: ==
    operatorId: EQUALS
    comparator: 11
  viz_type: table
  datasource: 0__table
