slice_name: "Deputado federal \xB7 Reelei\xE7\xE3o"
description: "Aproximado: o TSE muda o identificador a cada elei\xE7\xE3o e n\xE3\
  o h\xE1 CPF, ent\xE3o o cruzamento \xE9 pelo nome completo, no mesmo cargo e local."
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  annotation_layers: []
  color_scheme: supersetColors
  show_legend: true
  rich_tooltip: true
  x_axis: election_year
  xAxisForceCategorical: true
  metrics:
  - expressionType: SQL
    sqlExpression: 100.0 * COUNT(*) FILTER (WHERE elected AND elected_before) / NULLIF(COUNT(*)
      FILTER (WHERE elected_before), 0)
    label: '% dos que tentaram e venceram'
    hasCustomLabel: true
    optionName: metric_dosquetentaramevenceram
  - expressionType: SQL
    sqlExpression: 100.0 * COUNT(*) FILTER (WHERE elected AND elected_before) / NULLIF(COUNT(*)
      FILTER (WHERE elected), 0)
    label: "% dos eleitos que j\xE1 tinham o cargo"
    hasCustomLabel: true
    optionName: "metric_doseleitosquej\xE1tinhamocargo"
  groupby: []
  row_limit: 5000
  markerEnabled: true
  show_value: true
  y_axis_format: .1f
  truncate_metric: true
  order_desc: true
  x_axis_title: ''
  y_axis_title: ''
  adhoc_filters:
  - clause: WHERE
    expressionType: SIMPLE
    subject: office_code
    operator: ==
    operatorId: EQUALS
    comparator: 6
  - clause: WHERE
    expressionType: SQL
    sqlExpression: elected_before IS NOT NULL
  viz_type: echarts_timeseries_line
  datasource: 0__table
query_context: null
cache_timeout: null
