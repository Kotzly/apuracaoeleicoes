        \ se o maior ganho e a maior perda forem sim\xE9tricos: este mapa n\xE3o tem legenda: leia o\
        \ sinal e o valor pelo tooltip (passe o mouse) e pela tabela da aba Estados e cidades. \xC0 direita, a volatilidade (Pedersen) da UF para\
