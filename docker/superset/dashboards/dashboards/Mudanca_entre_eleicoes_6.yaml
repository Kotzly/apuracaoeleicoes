  MARKDOWN-note:
    type: MARKDOWN
    id: MARKDOWN-note
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-note
    meta:
      width: 12
      height: 40
      code: "**Como ler.** Para cada unidade (UF, cidade, zona ou se\xE7\xE3o) e para\
        \ o partido escolhido, a fatia dos votos v\xE1lidos na elei\xE7\xE3o de destino\
        \ menos a fatia na elei\xE7\xE3o anterior **do mesmo cargo** (Presidente 2014\u2192\
        2018\u21922022\u21922026; Prefeito 2016\u21922020\u21922024), em pontos percentuais\
        \ (p.p.). Cada linha dos dados j\xE1 \xE9 uma unidade \xD7 partido: as fatias\
        \ nunca s\xE3o somadas entre unidades. **Fus\xF5es n\xE3o s\xE3o unificadas**:\
        \ DEM e PSL continuam separados de UNI\xC3O, ent\xE3o a mudan\xE7a DEM/PSL\u2192\
        UNI\xC3O aparece como queda de um e alta do outro. Partido que n\xE3o disputou\
        \ conta 0%, n\xE3o falta. Em elei\xE7\xE3o presidencial a troca de candidatura\
        \ entre partidos (por exemplo PSL em 2018 \u2192 PL em 2022) aparece como\
        \ deslocamento entre partidos, e n\xE3o como continuidade do eleitorado. **Filtros:**\
        \ Cargo e Transi\xE7\xE3o s\xE3o obrigat\xF3rios e se encadeiam: ao trocar o Cargo, escolha a Transi\xE7\xE3o de novo (cargos federais\
        \ e municipais t\xEAm anos diferentes); Transi\xE7\xE3o termina em T1 (vota\xE7\
        \xE3o principal) ou T2 (revers\xE3o, s\xF3 onde o cargo teve segundo turno\
        \ nos dois anos: prefeito em poucas cidades, governador em parte dos estados).\
        \ Branco e Nulo tamb\xE9m s\xE3o op\xE7\xF5es do filtro Partido: o percentual deles \xE9 sobre todos os votos do local, enquanto o dos partidos continua sobre os v\xE1lidos, e eles n\xE3o entram na volatilidade. Partido vale nas abas que comparam um partido; UF tem sele\xE7\xE3o inversa;\
        \ Munic\xEDpio depende da UF e s\xF3 vale onde h\xE1 cidade (n\xE3o vale para\
        \ UF e zona)."
