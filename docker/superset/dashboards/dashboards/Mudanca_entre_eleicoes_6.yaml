        \ da fatia do partido escolhido, em pontos percentuais; a escala \xE9 sim\xE9trica em torno de zero.\
        \ **Vermelho** = perdeu: escuro abaixo de \u221210, m\xE9dio de \u221210 a \u22123, claro de \u22123 a \u22121.\
        \ **Cinza** = entre \u22121 e +1. **Azul** = ganhou: claro de 1 a 3, m\xE9dio de 3 a 10, escuro acima de 10.\
        \ Passe o mouse para ver a cidade e o valor. Fica sem cor a cidade fora da compara\xE7\xE3o (sem votos v\xE1lidos\
        \ nos dois anos), a em que o partido n\xE3o disputou em nenhum dos dois anos e a que n\xE3o tem contorno (Boa Esperan\xE7a do Norte-MT, criada em 2025); o exterior\
        \ n\xE3o aparece. N\xE3o h\xE1 mapa de fundo. Contornos: IBGE (malha municipal, qualidade m\xEDnima)."
