    - ROW-note
    meta:
      width: 12
      height: 30
      code: "**Como ler.** Cada coluna \xE9 um turno, e cada n\xF3 conta as se\xE7\
        \xF5es ou os munic\xEDpios em que aquele candidato foi o mais votado (s\xF3\
        \ votos v\xE1lidos; n\xE3o \xE9 necessariamente maioria absoluta). Uma liga\xE7\
        \xE3o conta se\xE7\xF5es ou munic\xEDpios, n\xE3o eleitores: ela n\xE3o diz\
        \ quantos votos mudaram, e uma vit\xF3ria por 51% conta igual a uma por 90%.\
        \ **Por se\xE7\xE3o:** entre turnos a se\xE7\xE3o \xE9 a mesma, mas entre\
        \ elei\xE7\xF5es o mesmo n\xFAmero pode ter sido redistribu\xEDdo e reunir\
        \ outros eleitores. **Por munic\xEDpio:** o munic\xEDpio \xE9 est\xE1vel entre\
        \ elei\xE7\xF5es, mas cada um pesa igual, seja qual for o tamanho, e as cidades\
        \ do exterior contam como munic\xEDpios (filtre por UF para retir\xE1-las).\
        \ Os n\xF3s `nova`/`novo` e `encerrada`/`encerrado` existem em apenas um dos\
        \ lados."
