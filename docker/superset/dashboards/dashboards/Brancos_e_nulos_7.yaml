    - ROW-note
    meta:
      width: 12
      height: 20
      code: "**Como ler.** O percentual \xE9 sobre todos os votos do local (v\xE1lidos, brancos e nulos),\
        \ porque brancos e nulos n\xE3o fazem parte dos v\xE1lidos. Federais (Presidente, Governador,\
        \ Senador e deputados) t\xEAm elei\xE7\xF5es em 2014, 2018, 2022 e 2026; municipais (Prefeito\
        \ e Vereador), em 2016, 2020 e 2024, ent\xE3o ao trocar o **Cargo** pode ser preciso trocar tamb\xE9\
        m **Ano** e **Transi\xE7\xE3o**. Senador tem dois votos por eleitor em 2018 e 2026, e o percentual\
        \ segue sendo sobre os votos, n\xE3o sobre os eleitores. **Entre turnos** s\xF3 compara os mesmos\
        \ locais, os que votaram nos dois turnos daquele cargo e ano: Governador e Prefeito t\xEAm 2\xBA\
        \ turno s\xF3 em parte do pa\xEDs, e Senador, deputados e Vereador n\xE3o t\xEAm. Zonas n\xE3\
        o aparecem porque o mapa delas mudou entre os anos. O exterior \xE9 a UF `ZZ`."
