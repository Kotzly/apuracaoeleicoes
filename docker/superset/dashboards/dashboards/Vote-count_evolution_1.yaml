    meta:
      width: 12
      height: 18
      code: "**How to read this dashboard.** Every polling-station ballot report (BU)\
        \ carries the time it was received by the Electoral Justice. The curves add\
        \ up the BUs in that order, for the year, round, office and area picked in\
        \ the filters. Times are in Bras\xEDlia time. 2018 has no receipt time in\
        \ the TSE files, so its curves stay empty; the totals still work."
