    meta:
      width: 12
      height: 30
      code: "**Como ler.** N\xFAmero de cadeiras de cada partido em cada elei\xE7\xE3\
        o de deputados (federal, estadual, distrital) e de vereadores, somado entre\
        \ as UFs selecionadas. A C\xE2mara dos Deputados tem 513 cadeiras em todas\
        \ as elei\xE7\xF5es. **Por que n\xE3o \xE9 um Sankey:** uma cadeira n\xE3\
        o passa de uma elei\xE7\xE3o para a outra, pois o mandato acaba e disputa-se\
        \ de novo; ligar partido a partido seria inventar fluxos que os dados n\xE3\
        o t\xEAm. Partidos que se fundiram (DEM e PSL em UNI\xC3O) aparecem separados\
        \ e somem das barras depois de 2018: n\xE3o \xE9 perda de cadeiras. O gr\xE1\
        fico de linhas mostra os 25 partidos com mais cadeiras no recorte."
