    - ROW-note
    meta:
      width: 12
      height: 40
      code: "**Como ler.** Cada aba mostra um recorte de quem foi eleito. Elei\xE7\
        \xF5es federais (Presidente, Governador, Senador e deputados) acontecem em\
        \ 2014, 2018, 2022 e 2026; as municipais (Prefeito e Vereador), em 2016, 2020\
        \ e 2024. Os nomes de partidos s\xE3o unificados quando s\xF3 mudaram de nome\
        \ (PMDB e MDB, PR e PL), mas **fus\xF5es n\xE3o s\xE3o unificadas**: DEM e\
        \ PSL continuam separados de UNI\xC3O, ent\xE3o somem do gr\xE1fico a partir\
        \ de 2022 sem que isso signifique perda de cadeiras. Os filtros valem s\xF3\
        \ para as abas em que a coluna existe: **Cargo** e **Ano** na aba Eleitos,\
        \ **Cargo (proporcional)** e **Ano** em Bancadas, **Ano** em Senado, **Cargo (proporcional)**\
        \ e **Ano da compara\xE7\xE3o** em Votos \xD7 cadeiras, **Munic\xEDpio** e\
        \ **Transi\xE7\xE3o** em Prefeitos; **UF** vale para todas, e **Partido**\
        \ para Eleitos, Bancadas e Senado. Em Governador e Prefeito, onde h\xE1 uma vaga s\xF3\
        , quem assumiu por \xFAltimo na elei\xE7\xE3o (inclusive em elei\xE7\xE3o\
        \ suplementar) \xE9 o eleito contado. A tabela de candidatos eleitos vem direto\
        \ da situa\xE7\xE3o final do TSE e, por padr\xE3o, s\xF3 mostra as elei\xE7\
        \xF5es ordin\xE1rias."
