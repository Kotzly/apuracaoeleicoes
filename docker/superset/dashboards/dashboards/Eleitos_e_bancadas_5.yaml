      width: 12
      height: 30
      code: "**Como ler.** Para o ano e o cargo escolhidos, compara a fatia dos votos\
        \ de cada partido com a fatia das cadeiras que ele conseguiu, no total nacional\
        \ (ou das UFs selecionadas). Os percentuais s\xE3o calculados somando votos\
        \ e cadeiras de cada partido e dividindo pelo total de todos os partidos,\
        \ nunca pela m\xE9dia de percentuais das UFs. S\xF3 faz sentido nos cargos\
        \ proporcionais (deputados e vereadores); a dist\xE2ncia entre as barras mostra\
        \ quanto o sistema (quociente, coliga\xE7\xF5es, sobras) distorce votos em\
        \ cadeiras. Votos s\xE3o do 1\xBA turno. O filtro **Partido** n\xE3o vale\
        \ nesta aba, porque os percentuais precisam do total de todos os partidos."
