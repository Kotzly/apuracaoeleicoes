      code: "**Como ler.** Cada coluna \xE9 uma elei\xE7\xE3o municipal (2016, 2020,\
        \ 2024; 2012 n\xE3o foi carregada) e cada faixa leva as cidades do partido\
        \ do prefeito de uma elei\xE7\xE3o ao partido do prefeito da seguinte. **Conta\
        \ cidades, n\xE3o eleitores.** Se houve mais de um eleito na mesma cidade\
        \ e elei\xE7\xE3o, vale quem assumiu por \xFAltimo, inclusive de elei\xE7\xE3\
        o suplementar. Cidade sem prefeito eleito aparece como **Sem eleito**. Os\
        \ 12 partidos com mais prefeitos nas tr\xEAs elei\xE7\xF5es t\xEAm n\xF3 pr\xF3\
        prio; os demais formam **Outros**: a tabela abaixo traz os fluxos partido\
        \ a partido, sem esse agrupamento, para ver quem est\xE1 dentro de Outros.\
        \ Fus\xF5es n\xE3o s\xE3o unificadas (DEM e PSL n\xE3o viram UNI\xC3O)."
