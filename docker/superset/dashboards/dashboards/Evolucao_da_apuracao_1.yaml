    - ROW-note2
    meta:
      width: 12
      height: 22
      code: "**Como ler esta aba.** Votos somados por partido, para o ano, turno,\
        \ cargo e \xE1rea escolhidos nos filtros. Siglas renomeadas aparecem com o\
        \ nome atual (PMDB \xE9 MDB, PC do B \xE9 PCDOB); fus\xF5es n\xE3o s\xE3o\
        \ unificadas (DEM e PSL continuam separados do Uni\xE3o Brasil). Nas barras,\
        \ cada partido separa os votos no candidato dos votos na legenda (s\xF3 existem\
        \ nos cargos proporcionais), em ordem de votos no candidato; brancos e nulos aparecem como itens pr\xF3prios,\
        \ e o cargo 25 fica de fora (siglas fict\xEDcias P17 e PCA1). **2014 e 2018 n\xE3o t\xEA\
        m hor\xE1rio de recebimento**: a curva fica vazia e as barras s\xF3 funcionam\
        \ sem filtro de hor\xE1rio. Cada se\xE7\xE3o tem um \xFAnico hor\xE1rio de\
        \ recebimento, ent\xE3o a curva de uma s\xF3 se\xE7\xE3o \xE9 um degrau. Recebimento\
        \ n\xE3o \xE9 divulga\xE7\xE3o: o hor\xE1rio \xE9 o de chegada do boletim\
        \ \xE0 Justi\xE7a Eleitoral, n\xE3o o de publica\xE7\xE3o do resultado. Zonas\
        \ e se\xE7\xF5es podem ter sido redesenhadas entre os anos."
