    meta:
      width: 12
      height: 18
      code: "**Como ler este painel.** Cada boletim de urna (BU) traz o hor\xE1rio\
        \ em que foi recebido pela Justi\xE7a Eleitoral. As curvas somam os BUs nessa\
        \ ordem, para o ano, turno, cargo e \xE1rea escolhidos nos filtros. Os hor\xE1\
        rios est\xE3o no hor\xE1rio de Bras\xEDlia. Em 2018 os arquivos do TSE n\xE3\
        o trazem o hor\xE1rio de recebimento, ent\xE3o as curvas ficam vazias; os\
        \ totais continuam valendo."
