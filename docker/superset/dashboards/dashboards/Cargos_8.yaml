        \ do 1\xBA turno derrotado no 2\xBA) s\xF3 ocorrem nas cidades com 2\xBA turno.\
        \ A margem \xE9 a diferen\xE7a em pontos percentuais entre o 1\xBA e o 2\xBA\
        \ colocado no \xFAltimo turno. Reelei\xE7\xE3o \xE9 aproximada: cruza-se o\
        \ nome completo no mesmo cargo e munic\xEDpio, pois o TSE muda o identificador\
        \ a cada elei\xE7\xE3o e n\xE3o h\xE1 CPF."
