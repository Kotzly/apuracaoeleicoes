  MARKDOWN-vereador-bench_note:
    type: MARKDOWN
    id: MARKDOWN-vereador-bench_note
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-main
    - TAB-vereador
    - TABS-vereador
    - TAB-vereador-4
    - ROW-vereador-4-0
    meta:
      width: 12
      height: 16
      code: "Como ler: s\xE3o 5.569 c\xE2maras municipais, e cada munic\xEDpio \xE9\
        \ um distrito eleitoral pr\xF3prio, com de 9 a 55 cadeiras conforme a popula\xE7\
        \xE3o. As cadeiras s\xE3o divididas entre os partidos munic\xEDpio a munic\xED\
        pio, pelo quociente partid\xE1rio (QP) e as sobras; por isso os totais por\
        \ partido s\xE3o a soma de milhares de disputas pequenas. S\xF3 h\xE1 elei\xE7\
        \xF5es municipais em 2016, 2020 e 2024; os gr\xE1ficos de s\xE9ries hist\xF3\
        ricas t\xEAm tr\xEAs pontos. Os partidos aparecem com o nome atual, mesmo\
        \ nas elei\xE7\xF5es em que existiam com outro nome ou antes de uma fus\xE3\
        o. Votos de legenda s\xE3o os dados ao partido, sem candidato. A reelei\xE7\
        \xE3o \xE9 aproximada: cruza-se o nome completo no mesmo cargo e munic\xED\
        pio, pois o TSE muda o identificador a cada elei\xE7\xE3o e n\xE3o h\xE1 CPF;\
        \ hom\xF4nimos e mudan\xE7as de nome distorcem o resultado. N\xE3o h\xE1 2\xBA\
        \ turno para este cargo. A tabela de puxadores ordena pelo n\xFAmero bruto\
        \ de votos, o que favorece as capitais e as maiores cidades; para a for\xE7\
        a relativa dentro do munic\xEDpio, use a tabela de maior percentual dos votos\
        \ v\xE1lidos. Nos filtros, escolha UF e Munic\xEDpio para olhar uma c\xE2\
        mara s\xF3."
