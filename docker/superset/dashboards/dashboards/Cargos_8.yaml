        \ pode diferir do mais votado quando houve elei\xE7\xE3o suplementar ou candidatura\
        \ barrada. A continuidade compara com a elei\xE7\xE3o anterior, quatro anos\
        \ antes, e n\xE3o existe em 2014, o primeiro ano da base. Viradas s\xF3 podem\
        \ ocorrer onde houve 2\xBA turno (14 estados em 2014 e 2018, 12 em 2022 e\
        \ 6 em 2026). A margem \xE9 a diferen\xE7a em pontos percentuais entre o 1\xBA\
        \ e o 2\xBA colocado no \xFAltimo turno. Reelei\xE7\xE3o \xE9 aproximada:\
        \ cruza-se o nome completo no mesmo cargo e estado, pois o TSE muda o identificador\
        \ a cada elei\xE7\xE3o e n\xE3o h\xE1 CPF."
