        \ aparecem com o nome atual, mesmo nas elei\xE7\xF5es em que existiam com\
        \ outro nome ou antes de uma fus\xE3o. Votos de legenda s\xE3o os dados ao\
        \ partido, sem candidato. A reelei\xE7\xE3o \xE9 aproximada: cruza-se o nome\
        \ completo no mesmo cargo e UF, pois o TSE muda o identificador a cada elei\xE7\
        \xE3o e n\xE3o h\xE1 CPF; hom\xF4nimos e mudan\xE7as de nome distorcem o resultado.\
