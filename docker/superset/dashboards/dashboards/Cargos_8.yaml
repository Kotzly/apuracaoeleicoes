    - ROW-deputado_federal-4-0
    meta:
      width: 12
      height: 14
      code: "Como ler: a C\xE2mara tem 513 cadeiras, distribu\xEDdas entre as 27 UFs\
        \ de 8 a 70 cadeiras, e cada UF \xE9 um distrito eleitoral. As cadeiras s\xE3\
        o divididas entre os partidos pelo quociente partid\xE1rio (QP) e as sobras,\
        \ pela m\xE9dia; por isso um partido pode ter menos votos que outro e mais\
        \ cadeiras. Os partidos aparecem com o nome atual, mesmo nas elei\xE7\xF5\
        es em que existiam com outro nome ou antes de uma fus\xE3o. Votos de legenda\
        \ s\xE3o os dados ao partido, sem candidato. A reelei\xE7\xE3o \xE9 aproximada:\
        \ cruza-se o nome completo no mesmo cargo e UF, pois o TSE muda o identificador\
        \ a cada elei\xE7\xE3o e n\xE3o h\xE1 CPF; hom\xF4nimos e mudan\xE7as de nome\
        \ distorcem o resultado. N\xE3o h\xE1 2\xBA turno para este cargo."
