  MARKDOWN-senador-senate_note:
    type: MARKDOWN
    id: MARKDOWN-senador-senate_note
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-main
    - TAB-senador
    - TABS-senador
    - TAB-senador-4
    - ROW-senador-4-0
    meta:
      width: 12
      height: 22
      code: "Como ler: o Senado tem 81 cadeiras, 3 por estado, e cada senador cumpre\
        \ 8 anos. A elei\xE7\xE3o alterna entre um ter\xE7o (uma vaga por estado,\
        \ 27 no total, como em 2014 e 2022) e dois ter\xE7os (duas vagas por estado,\
        \ 54 no total, como em 2018 e 2026). Em 2018 e em 2026 cada eleitor tem dois\
        \ votos, um para cada vaga, ent\xE3o os votos somam o dobro dos eleitores\
        \ e o percentual de cada candidato \xE9 sobre os votos v\xE1lidos de todas\
        \ as vagas. N\xE3o h\xE1 2\xBA turno: quem tem mais votos ocupa a vaga. A\
        \ composi\xE7\xE3o acumulada soma a elei\xE7\xE3o escolhida \xE0 anterior,\
        \ as duas que preenchem as 81 cadeiras, e s\xF3 existe de 2018 em diante,\
        \ quando as duas elei\xE7\xF5es est\xE3o na base. Ela conta o partido pelo\
        \ qual o senador foi eleito: trocas de partido posteriores e suplentes que\
        \ assumiram n\xE3o aparecem. DEM e PSL j\xE1 constam como UNI\xC3O na composi\xE7\
        \xE3o de 2022 em diante. As vagas por estado v\xEAm das vagas registradas\
        \ no TSE para a elei\xE7\xE3o ordin\xE1ria, sem as suplementares. A reelei\xE7\
        \xE3o compara com a elei\xE7\xE3o de 8 anos antes, a da mesma vaga, e s\xF3\
        \ existe de 2022 em diante; \xE9 aproximada, pelo nome completo no mesmo estado,\
        \ pois o TSE muda o identificador a cada elei\xE7\xE3o e n\xE3o h\xE1 CPF."
