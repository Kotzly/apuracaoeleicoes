    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-note
    meta:
      width: 12
      height: 34
      code: "**Como ler.** Cada linha \xE9 uma cidade e um finalista da elei\xE7\xE3o presidencial; os\
        \ gr\xE1ficos mostram o finalista escolhido no filtro **Candidato**, e a varia\xE7\xE3o \xE9 o\
        \ 2\xBA turno menos o 1\xBA, na pr\xF3pria cidade (nada \xE9 somado entre cidades). No 1\xBA turno\
        \ h\xE1 muitos candidatos e no 2\xBA s\xF3 dois, ent\xE3o os finalistas quase sempre ganham participa\xE7\
        \xE3o ao herdar votos dos eliminados: a alta m\xE9dia medida \xE9 de 3 a 10 pontos percentuais\
        \ por ano, e \xE9 essa a refer\xEAncia para julgar uma cidade, n\xE3o o zero. Cidades pequenas\
        \ dominam a varia\xE7\xE3o em pontos percentuais e cidades grandes dominam a varia\xE7\xE3o em\
        \ votos; por isso h\xE1 o filtro **M\xEDnimo de votos no 1\xBA turno**, j\xE1 que cidades min\xFA\
        sculas e o exterior costumam encabe\xE7ar o ranking em %. A participa\xE7\xE3o \xE9 sobre votos\
        \ v\xE1lidos. O exterior \xE9 a UF `ZZ`: para tirar estados (inclusive `ZZ`), use o filtro **UF**\
        \ com a op\xE7\xE3o de excluir selecionados (\"Inverse selection\"). N\xE3o h\xE1 ajuste pela\
        \ m\xE9dia nacional. \"Maiores quedas\" s\xF3 lista cidades em que o candidato realmente perdeu\
        \ (pode ficar vazio)."
