metadata:
  native_filter_configuration:
  - id: NATIVE_FILTER-shiftYear
    name: Ano
    filterType: filter_select
    type: NATIVE_FILTER
    targets:
    - column:
        name: election_year
      datasetUuid: e5e3b5c0-f8bc-42b4-b061-57ca411749c9
    controlValues:
      enableEmptyFilter: true
      defaultToFirstItem: false
      multiSelect: false
      searchAllOptions: false
      inverseSelection: false
      sortAscending: false
    defaultDataMask:
      extraFormData:
        filters:
        - col: election_year
          op: IN
          val: [2026]
      filterState:
        value: [2026]
      ownState: {}
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    description: ''
  - id: NATIVE_FILTER-shiftCandidate
    name: Candidato
    filterType: filter_select
    type: NATIVE_FILTER
    targets:
    - column:
        name: candidate_name
      datasetUuid: e5e3b5c0-f8bc-42b4-b061-57ca411749c9
    controlValues:
      enableEmptyFilter: true
      defaultToFirstItem: false
      multiSelect: false
      searchAllOptions: false
      inverseSelection: false
      sortAscending: true
    defaultDataMask:
      extraFormData:
        filters:
        - col: candidate_name
          op: IN
          val: ["LULA"]
      filterState:
        value: ["LULA"]
      ownState: {}
    cascadeParentIds:
    - NATIVE_FILTER-shiftYear
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    description: ''
  - id: NATIVE_FILTER-shiftState
    name: UF
    filterType: filter_select
    type: NATIVE_FILTER
    targets:
    - column:
        name: state
      datasetUuid: e5e3b5c0-f8bc-42b4-b061-57ca411749c9
    controlValues:
      enableEmptyFilter: false
      defaultToFirstItem: false
      multiSelect: true
      searchAllOptions: false
      inverseSelection: true
      sortAscending: true
    defaultDataMask:
      extraFormData: {}
      filterState: {}
      ownState: {}
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    description: ''
  - id: NATIVE_FILTER-shiftCity
    name: "Munic\xEDpio"
    filterType: filter_select
    type: NATIVE_FILTER
    targets:
    - column:
        name: label
      datasetUuid: e5e3b5c0-f8bc-42b4-b061-57ca411749c9
    controlValues:
      enableEmptyFilter: false
      defaultToFirstItem: false
      multiSelect: true
      searchAllOptions: false
      inverseSelection: false
      sortAscending: true
    defaultDataMask:
      extraFormData: {}
      filterState: {}
      ownState: {}
    cascadeParentIds:
    - NATIVE_FILTER-shiftState
    scope:
      rootPath:
      - TAB-pct
      - TAB-abs
      excluded: []
    description: ''
  - id: NATIVE_FILTER-shiftMinVotes
    name: "M\xEDnimo de votos no 1\xBA turno"
    filterType: filter_range
    type: NATIVE_FILTER
    targets:
