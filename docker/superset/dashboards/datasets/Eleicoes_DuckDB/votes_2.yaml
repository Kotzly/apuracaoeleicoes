  filterable: true
  expression: "CASE WHEN vote_type IN ('Branco', 'Nulo') THEN vote_type ELSE (CASE party WHEN 'PMDB' THEN 'MDB' WHEN 'PTN' THEN 'PODE' WHEN 'PT do B' THEN 'AVANTE' WHEN 'PSDC' THEN 'DC' WHEN 'SD' THEN 'SOLIDARIEDADE' WHEN 'PR' THEN 'PL' WHEN 'PRB' THEN 'REPUBLICANOS' WHEN 'PPS' THEN 'CIDADANIA' WHEN 'PEN' THEN 'PATRIOTA' WHEN 'PATRI' THEN 'PATRIOTA' WHEN 'PTC' THEN 'AGIR' WHEN 'PMN' THEN 'MOBILIZA' WHEN 'PMB' THEN 'DEMOCRATA' WHEN 'PC do B' THEN 'PCDOB' ELSE party END) END"
