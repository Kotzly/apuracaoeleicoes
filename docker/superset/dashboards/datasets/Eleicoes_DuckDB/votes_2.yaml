  type: VARCHAR
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: (CASE party WHEN 'PMDB' THEN 'MDB' WHEN 'PTN' THEN 'PODE' WHEN 'PT do
    B' THEN 'AVANTE' WHEN 'PSDC' THEN 'DC' WHEN 'SD' THEN 'SOLIDARIEDADE' WHEN 'PR'
    THEN 'PL' WHEN 'PRB' THEN 'REPUBLICANOS' WHEN 'PPS' THEN 'CIDADANIA' WHEN 'PEN'
    THEN 'PATRIOTA' WHEN 'PATRI' THEN 'PATRIOTA' WHEN 'PTC' THEN 'AGIR' WHEN 'PMN'
    THEN 'MOBILIZA' WHEN 'PMB' THEN 'DEMOCRATA' WHEN 'PC do B' THEN 'PCDOB' ELSE party
    END)
