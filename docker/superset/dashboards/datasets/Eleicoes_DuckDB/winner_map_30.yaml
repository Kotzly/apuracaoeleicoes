table_name: winner_map
main_dttm_col: null
currency_code_column: null
description: "Partido eleito para governador e prefeito, com o contorno de cada munic\xED\
  pio (IBGE) para o mapa."
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: main
sql: WITH places AS (SELECT DISTINCT state, municipality_code, municipality_ibge_code
  FROM municipality_results WHERE municipality_ibge_code IS NOT NULL) SELECT w.office_code,
  w.election_year, w.state, coalesce(w.label, w.state) AS label, w.winner_name, w.continuity_party
  AS party_current, s.polygon FROM unit_winners w JOIN places p ON p.state = w.state
  AND (w.municipality_code IS NULL OR p.municipality_code = w.municipality_code) JOIN
  municipality_shapes s ON s.municipality_ibge_code = p.municipality_ibge_code WHERE
  w.office_code IN (3, 11)
