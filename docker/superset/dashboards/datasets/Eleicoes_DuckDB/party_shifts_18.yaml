sql: "SELECT p.* EXCLUDE (share_from, share_to, share_change, share_from_all, share_to_all), b.vote_base, CASE WHEN b.vote_base = 'Todos os votos' THEN p.share_from_all ELSE p.share_from END AS share_from, CASE WHEN b.vote_base = 'Todos os votos' THEN p.share_to_all ELSE p.share_to END AS share_to, CASE WHEN b.vote_base = 'Todos os votos' THEN p.share_to_all - p.share_from_all ELSE p.share_change END AS share_change FROM party_shifts p CROSS JOIN (VALUES ('Votos v\xe1lidos'), ('Todos os votos')) b(vote_base)"
