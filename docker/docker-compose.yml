# Superset with the election-tally dashboards.
#
#   cp .env.example .env            # then set SUPERSET_SECRET_KEY
#   docker compose up --build       # http://localhost:8088
#
# The DuckDB file comes from the pipeline (python -m election_tally pipeline ...).
services:
  # Runs once before Superset and exits: builds the tables derived from the loaded data
  # (quick when they are up to date). Uses Superset's image so both share one DuckDB version.
  prepare-data:
    build: ./superset
    image: election-tally-superset:6.1.0
    user: root
    working_dir: /src
    entrypoint: ["python", "-m", "election_tally", "build-derived", "--db", "/data/elections.duckdb"]
    volumes:
      - type: bind
        source: ${ELECTIONS_DB:-../elections.duckdb}
        target: /data/elections.duckdb
        bind:
          create_host_path: false
      - type: bind
        source: ../election_tally
        target: /src/election_tally
        read_only: true
    restart: "no"

  superset:
    build: ./superset
    image: election-tally-superset:6.1.0
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    ports:
      # Local only by default: the default login is admin/admin, it opens SQL Lab, and DuckDB can
      # read files. Set SUPERSET_BIND=0.0.0.0 only with a real password.
      - "${SUPERSET_BIND:-127.0.0.1}:${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in docker/.env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    volumes:
      # Election data, read-only. Fails fast if the file does not exist yet,
      # instead of letting Docker create an empty directory in its place.
      - type: bind
        source: ${ELECTIONS_DB:-../elections.duckdb}
        target: /data/elections.duckdb
        read_only: true
        bind:
          create_host_path: false
      # Dashboards kept in the repo; imported on every start.
      - type: bind
        source: ./superset/dashboards
        target: /app/dashboards
        read_only: true
      # What generates the Cargos dashboard on every start.
      - type: bind
        source: ./superset/build_office_dashboard.py
        target: /app/build_office_dashboard.py
        read_only: true
      - type: bind
        source: ./superset/office_specs
        target: /app/office_specs
        read_only: true
      # Superset's own metadata (users, saved charts), kept across restarts.
      - superset_home:/app/superset_home
    restart: unless-stopped

volumes:
  superset_home:
